# Existing pi public keys remain the access path; validate with sshd -t.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
LoginGraceTime 30
MaxAuthTries 3
ClientAliveInterval 60
ClientAliveCountMax 3
TCPKeepAlive yes
GatewayPorts no
X11Forwarding no
LogLevel VERBOSE
